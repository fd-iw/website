<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusAI — Multi-Model Chat</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-0:#06060b;
  --bg-1:#0c0c14;
  --bg-2:#12121c;
  --bg-3:#1a1a28;
  --bg-4:#222233;
  --bg-hover:#1e1e30;
  --border:#252538;
  --border-dim:#1a1a2a;
  --text-1:#ededf4;
  --text-2:#9494b0;
  --text-3:#5c5c78;
  --accent:#7c6aef;
  --accent-dim:rgba(124,106,239,0.12);
  --accent-glow:rgba(124,106,239,0.08);
  --accent-hover:#8d7ff5;
  --green:#34d399;
  --green-dim:rgba(52,211,153,0.1);
  --red:#f87171;
  --red-dim:rgba(248,113,113,0.1);
  --yellow:#fbbf24;
  --yellow-dim:rgba(251,191,36,0.1);
  --or-color:#E040FB;
  --hf-color:#FFD54F;
  --an-color:#D4A054;
  --oa-color:#10a37f;
  --xi-color:#4DA6FF;
  --radius:10px;
  --radius-lg:14px;
  --radius-xl:18px;
  --ease:cubic-bezier(0.4,0,0.2,1);
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--bg-0);
  color:var(--text-1);
  display:flex;height:100vh;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}

.lucide{width:16px;height:16px;stroke-width:2}
.lucide-sm{width:14px;height:14px}
.lucide-lg{width:20px;height:20px}
.lucide-xl{width:24px;height:24px}

/* ═══ SIDEBAR ═══ */
.sidebar{
  width:280px;min-width:280px;
  background:var(--bg-1);
  border-right:1px solid var(--border-dim);
  display:flex;flex-direction:column;height:100vh;
  transition:transform .3s var(--ease),min-width .3s var(--ease),width .3s var(--ease);
  z-index:100;
}
.sidebar.collapsed{transform:translateX(-280px);min-width:0;width:0;overflow:hidden}

.sidebar-header{
  padding:20px 18px 16px;
  display:flex;align-items:center;gap:11px;
  border-bottom:1px solid var(--border-dim);
}
.logo-mark{
  width:34px;height:34px;
  background:linear-gradient(135deg,var(--accent),#a98df0);
  border-radius:9px;
  display:grid;place-items:center;
  box-shadow:0 0 24px rgba(124,106,239,0.25);
  flex-shrink:0;
}
.logo-mark i{color:#fff}
.logo-text{
  font-family:'Instrument Serif',serif;
  font-size:20px;font-weight:400;
  letter-spacing:-0.4px;
}
.logo-sub{font-size:9.5px;color:var(--text-3);letter-spacing:1.6px;text-transform:uppercase;margin-top:-1px}

.new-chat-btn{
  margin:14px 12px 6px;padding:10px 14px;
  background:linear-gradient(135deg,var(--accent),#9580f5);
  border:none;border-radius:var(--radius);
  color:#fff;font:600 12.5px/1 'DM Sans',sans-serif;
  cursor:pointer;display:flex;align-items:center;gap:8px;
  transition:.2s var(--ease);
  box-shadow:0 2px 16px rgba(124,106,239,0.3);
}
.new-chat-btn:hover{transform:translateY(-1px);box-shadow:0 4px 24px rgba(124,106,239,0.4)}
.new-chat-btn i{color:#fff}

.section-label{
  padding:14px 18px 6px;
  font-size:9.5px;font-weight:600;
  color:var(--text-3);letter-spacing:1.4px;text-transform:uppercase;
}
.chat-list{flex:1;overflow-y:auto;padding:2px 8px}
.chat-item{
  padding:9px 12px;border-radius:8px;
  cursor:pointer;font-size:12.5px;color:var(--text-2);
  transition:.15s var(--ease);
  display:flex;align-items:center;gap:9px;
  margin-bottom:1px;position:relative;
}
.chat-item:hover{background:var(--bg-hover);color:var(--text-1)}
.chat-item.active{background:var(--accent-dim);color:var(--text-1)}
.chat-item i{opacity:.4;flex-shrink:0}
.chat-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.delete-chat{
  opacity:0;border:none;background:none;
  color:var(--red);cursor:pointer;padding:2px;border-radius:4px;
  display:grid;place-items:center;transition:.15s var(--ease);
}
.chat-item:hover .delete-chat{opacity:.6}
.delete-chat:hover{opacity:1!important;background:var(--red-dim)}

.sidebar-footer{
  padding:12px;border-top:1px solid var(--border-dim);
}
.keys-btn{
  width:100%;padding:9px 12px;
  background:var(--bg-3);border:1px solid var(--border);border-radius:8px;
  color:var(--text-2);font:500 12px/1 'DM Sans',sans-serif;
  cursor:pointer;display:flex;align-items:center;gap:8px;
  transition:.15s var(--ease);
}
.keys-btn:hover{background:var(--bg-4);color:var(--text-1);border-color:var(--accent)}
.keys-btn i{opacity:.5}

/* ═══ MAIN ═══ */
.main{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0}

.topbar{
  padding:10px 16px;
  border-bottom:1px solid var(--border-dim);
  display:flex;align-items:center;gap:10px;
  background:var(--bg-1);
  position:relative;z-index:50;
}
.tb-btn{
  width:34px;height:34px;
  background:var(--bg-3);border:1px solid var(--border);border-radius:8px;
  cursor:pointer;color:var(--text-2);
  display:grid;place-items:center;transition:.15s var(--ease);flex-shrink:0;
}
.tb-btn:hover{background:var(--bg-4);color:var(--text-1)}

.model-sel-wrap{flex:1;display:flex;justify-content:center}
.model-sel{
  padding:7px 14px;
  background:var(--bg-3);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text-1);font:500 12.5px/1 'DM Sans',sans-serif;
  cursor:pointer;display:flex;align-items:center;gap:9px;
  transition:.15s var(--ease);position:relative;min-width:270px;
  justify-content:space-between;user-select:none;
}
.model-sel:hover{border-color:var(--accent)}
.model-sel .sel-arrow{transition:transform .2s var(--ease);color:var(--text-3)}
.model-sel.open .sel-arrow{transform:rotate(180deg)}
.prov-badge{
  font-size:9px;padding:2px 8px;border-radius:5px;
  font-weight:600;letter-spacing:.3px;text-transform:uppercase;line-height:1.4;
}

.model-dd{
  position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);
  width:440px;max-height:480px;overflow-y:auto;
  background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:0 12px 48px rgba(0,0,0,.5);
  z-index:200;display:none;
}
.model-dd.show{display:block;animation:ddIn .18s var(--ease)}
@keyframes ddIn{from{opacity:0;transform:translateX(-50%) translateY(-6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.dd-search{
  padding:10px 14px;border-bottom:1px solid var(--border-dim);
  position:sticky;top:0;background:var(--bg-1);z-index:1;
}
.dd-search input{
  width:100%;padding:8px 12px 8px 34px;
  background:var(--bg-3);border:1px solid var(--border);border-radius:8px;
  color:var(--text-1);font:13px 'DM Sans',sans-serif;outline:none;
  transition:.15s var(--ease);
}
.dd-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.dd-search input::placeholder{color:var(--text-3)}
.dd-search-wrap{position:relative}
.dd-search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3)}

.prov-group{padding:6px 0}
.prov-label{
  padding:4px 14px;font-size:9.5px;font-weight:600;
  color:var(--text-3);letter-spacing:1.3px;text-transform:uppercase;
  display:flex;align-items:center;gap:7px;
}
.prov-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.mod-opt{
  padding:9px 14px;margin:1px 6px;border-radius:7px;
  cursor:pointer;display:flex;align-items:center;gap:10px;
  transition:.12s var(--ease);
}
.mod-opt:hover{background:var(--bg-hover)}
.mod-opt.selected{background:var(--accent-dim)}
.mod-name{font-size:12.5px;font-weight:500;flex:1}
.mod-tag{
  font-size:8.5px;padding:2px 7px;border-radius:4px;
  font-weight:600;letter-spacing:.3px;line-height:1.4;
}
.mod-opt .lock-ind{color:var(--text-3)}

.clr-or{background:var(--or-color)}.clr-hf{background:var(--hf-color);color:#333}.clr-an{background:var(--an-color)}.clr-oa{background:var(--oa-color)}.clr-xi{background:var(--xi-color)}
.bg-or{background:rgba(224,64,251,.1);color:var(--or-color)}.bg-hf{background:rgba(255,213,79,.1);color:var(--hf-color)}.bg-an{background:rgba(212,160,84,.1);color:var(--an-color)}.bg-oa{background:rgba(16,163,127,.1);color:var(--oa-color)}.bg-xi{background:rgba(77,166,255,.1);color:var(--xi-color)}
.dot-or{background:var(--or-color)}.dot-hf{background:var(--hf-color)}.dot-an{background:var(--an-color)}.dot-oa{background:var(--oa-color)}.dot-xi{background:var(--xi-color)}

/* ═══ CHAT ═══ */
.chat-area{flex:1;overflow-y:auto;padding:20px 0;display:flex;flex-direction:column}
.msg-wrap{max-width:760px;width:100%;margin:0 auto;padding:0 20px;flex:1;display:flex;flex-direction:column}

.welcome{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;gap:14px;padding:40px 20px;
}
.welcome-glyph{
  width:64px;height:64px;
  background:linear-gradient(135deg,var(--accent),#a98df0);
  border-radius:18px;display:grid;place-items:center;
  box-shadow:0 0 48px rgba(124,106,239,0.2);
  animation:wFloat 3.5s ease-in-out infinite;
}
.welcome-glyph i{color:#fff}
@keyframes wFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.welcome h2{
  font-family:'Instrument Serif',serif;
  font-size:28px;font-weight:400;
  background:linear-gradient(135deg,var(--text-1) 30%,var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.welcome p{font-size:13.5px;color:var(--text-3);max-width:380px;line-height:1.65}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:4px}
.chip{
  padding:7px 14px;
  background:var(--bg-3);border:1px solid var(--border);border-radius:18px;
  font-size:11.5px;color:var(--text-2);cursor:pointer;
  transition:.15s var(--ease);display:flex;align-items:center;gap:6px;
}
.chip:hover{border-color:var(--accent);color:var(--text-1);background:var(--accent-dim)}
.chip i{opacity:.5}

/* Messages */
.msg{
  display:flex;gap:10px;margin-bottom:18px;
  animation:msgIn .25s var(--ease);max-width:100%;
}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}
.msg-avatar{
  width:30px;height:30px;min-width:30px;border-radius:9px;
  display:grid;place-items:center;flex-shrink:0;
}
.msg.user .msg-avatar{background:linear-gradient(135deg,var(--accent),#a98df0)}
.msg.user .msg-avatar i{color:#fff}
.msg.assistant .msg-avatar{background:var(--bg-3);border:1px solid var(--border)}
.msg.assistant .msg-avatar i{color:var(--text-2)}
.msg-body{
  max-width:72%;padding:11px 15px;
  border-radius:var(--radius-lg);
  font-size:13.5px;line-height:1.7;
}
.msg.user .msg-body{
  background:linear-gradient(135deg,rgba(124,106,239,0.08),rgba(124,106,239,0.04));
  border:1px solid rgba(124,106,239,0.1);
  border-bottom-right-radius:4px;
}
.msg.assistant .msg-body{
  background:var(--bg-2);border:1px solid var(--border-dim);
  border-bottom-left-radius:4px;
}
.msg-body pre{
  background:var(--bg-0);border:1px solid var(--border);border-radius:8px;
  padding:12px 14px;overflow-x:auto;margin:8px 0;
  font:12.5px/1.6 'JetBrains Mono',monospace;
}
.msg-body code{
  font:12px 'JetBrains Mono',monospace;
  background:var(--bg-0);padding:1.5px 5px;border-radius:4px;
}
.msg-body pre code{background:none;padding:0}
.msg-body p{margin-bottom:6px}
.msg-body p:last-child{margin-bottom:0}
.msg-body strong{color:var(--accent);font-weight:600}
.msg-body ul,.msg-body ol{margin:6px 0;padding-left:18px}
.msg-body li{margin-bottom:3px}
.msg-meta{
  display:flex;align-items:center;gap:6px;
  margin-top:6px;font-size:10px;color:var(--text-3);
}
.msg-meta i{opacity:.4}

.reasoning-block{
  margin-bottom:6px;
  border:1px solid rgba(124,106,239,0.15);
  border-radius:8px;
  background:rgba(124,106,239,0.04);
  overflow:hidden;
}
.reasoning-block summary{
  padding:7px 12px;
  font-size:11px;font-weight:600;color:var(--accent);
  cursor:pointer;display:flex;align-items:center;gap:6px;
  list-style:none;user-select:none;
}
.reasoning-block summary::-webkit-details-marker{display:none}
.reasoning-block summary::after{
  content:'▸';margin-left:auto;font-size:10px;
  transition:transform .15s var(--ease);color:var(--text-3);
}
.reasoning-block[open] summary::after{transform:rotate(90deg)}
.reasoning-content{
  padding:8px 12px 10px;
  font-size:12px;line-height:1.6;color:var(--text-2);
  border-top:1px solid rgba(124,106,239,0.1);
  max-height:200px;overflow-y:auto;
}
.reasoning-block summary i{color:var(--accent)}

.typing{display:flex;gap:4px;padding:4px 0}
.typing span{
  width:6px;height:6px;background:var(--text-3);border-radius:50%;
  animation:blink 1.4s ease-in-out infinite;
}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:scale(1)}30%{opacity:1;transform:scale(1.15)}}

/* Input */
.input-area{
  padding:14px 20px 18px;
  background:var(--bg-1);border-top:1px solid var(--border-dim);
}
.input-row{
  max-width:760px;margin:0 auto;
  display:flex;gap:8px;align-items:flex-end;
}
.input-box{
  flex:1;background:var(--bg-3);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:10px 14px;
  display:flex;align-items:flex-end;gap:8px;
  transition:.15s var(--ease);
}
.input-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.input-box textarea{
  flex:1;background:none;border:none;outline:none;
  color:var(--text-1);font:13.5px/1.5 'DM Sans',sans-serif;
  resize:none;max-height:140px;
}
.input-box textarea::placeholder{color:var(--text-3)}
.send-btn{
  width:36px;height:36px;
  background:linear-gradient(135deg,var(--accent),#9580f5);
  border:none;border-radius:9px;color:#fff;
  cursor:pointer;display:grid;place-items:center;
  transition:.15s var(--ease);flex-shrink:0;
}
.send-btn:hover{transform:scale(1.05);box-shadow:0 2px 14px rgba(124,106,239,0.35)}
.send-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.send-btn i{color:#fff}

/* Inline key prompt */
.key-prompt{
  background:var(--bg-3);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 18px;
  margin-bottom:16px;animation:msgIn .25s var(--ease);
}
.key-prompt-head{
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:600;margin-bottom:3px;
}
.key-prompt-head i{color:var(--yellow)}
.key-prompt p{font-size:11.5px;color:var(--text-3);margin-bottom:10px;line-height:1.5}
.key-row{display:flex;gap:6px}
.key-input{
  flex:1;padding:8px 12px;
  background:var(--bg-2);border:1px solid var(--border);border-radius:7px;
  color:var(--text-1);font:12px 'JetBrains Mono',monospace;
  outline:none;transition:.15s var(--ease);
}
.key-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.key-input::placeholder{color:var(--text-3);font-family:'DM Sans',sans-serif}
.vis-btn{
  width:36px;background:var(--bg-2);border:1px solid var(--border);border-radius:7px;
  cursor:pointer;color:var(--text-3);display:grid;place-items:center;
  transition:.15s var(--ease);
}
.vis-btn:hover{color:var(--text-1);border-color:var(--accent)}
.save-btn{
  padding:8px 16px;
  background:var(--accent);border:none;border-radius:7px;
  color:#fff;font:600 11.5px/1 'DM Sans',sans-serif;
  cursor:pointer;transition:.15s var(--ease);white-space:nowrap;
}
.save-btn:hover{background:var(--accent-hover)}

/* Modal */
.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.55);backdrop-filter:blur(6px);
  z-index:500;display:none;align-items:center;justify-content:center;
}
.overlay.show{display:flex;animation:fadeIn .15s var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--bg-1);border:1px solid var(--border);
  border-radius:var(--radius-xl);
  width:500px;max-width:92vw;max-height:85vh;overflow-y:auto;
  box-shadow:0 16px 60px rgba(0,0,0,.5);
  animation:modIn .25s var(--ease);
}
@keyframes modIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-head{
  padding:18px 22px;border-bottom:1px solid var(--border-dim);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-head h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.modal-head h3 i{color:var(--yellow)}
.modal-x{
  width:30px;height:30px;
  background:var(--bg-3);border:1px solid var(--border);border-radius:7px;
  cursor:pointer;color:var(--text-3);display:grid;place-items:center;
  transition:.15s var(--ease);
}
.modal-x:hover{background:var(--bg-4);color:var(--text-1)}
.modal-body{padding:18px 22px}
.key-group{margin-bottom:18px}
.key-group:last-child{margin-bottom:0}
.key-label{
  display:flex;align-items:center;gap:8px;margin-bottom:7px;
}
.key-icon{
  width:22px;height:22px;border-radius:5px;
  display:grid;place-items:center;
  font-size:10px;font-weight:700;color:#fff;flex-shrink:0;
}
.key-label span.kn{font-size:12.5px;font-weight:600}
.key-status{
  margin-left:auto;font-size:9.5px;font-weight:600;
  padding:2px 8px;border-radius:8px;display:flex;align-items:center;gap:4px;
}
.key-status.on{background:var(--green-dim);color:var(--green)}
.key-status.off{background:var(--red-dim);color:var(--red)}
.key-status i{width:10px;height:10px}
.key-hint{font-size:10.5px;color:var(--text-3);margin-top:5px;line-height:1.4}

/* Toast */
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:var(--bg-3);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px 18px;
  font-size:12px;color:var(--red);
  display:none;align-items:center;gap:8px;
  box-shadow:0 4px 24px rgba(0,0,0,.4);
  z-index:600;
}
.toast.show{display:flex;animation:toastIn .2s var(--ease)}
.toast i{flex-shrink:0}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;height:100vh;box-shadow:0 0 40px rgba(0,0,0,.5)}
  .sidebar.collapsed{transform:translateX(-280px)}
  .model-dd{width:calc(100vw - 32px);max-width:400px}
  .msg-body{max-width:86%}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo-mark"><i data-lucide="sparkles" class="lucide-sm"></i></div>
    <div>
      <div class="logo-text">NexusAI</div>
      <div class="logo-sub">Multi-Model Chat</div>
    </div>
  </div>
  <button class="new-chat-btn" onclick="newChat()">
    <i data-lucide="plus" class="lucide-sm"></i> New Chat
  </button>
  <div class="section-label">History</div>

   PROVIDERS — correct API integration
   ═══════════════════════════════════════════ */
const PROVIDERS = {
  openrouter: {
    name: 'OpenRouter',
    cls: 'or',
    placeholder: 'sk-or-v1-…',
    hint: 'Get your key at openrouter.ai/keys',
    /*
     * OpenRouter API (per docs at openrouter.ai/docs/api/reference/overview):
     *  - Endpoint: POST https://openrouter.ai/api/v1/chat/completions
     *  - Auth: Authorization: Bearer <key>
     *  - Required headers: Content-Type application/json
     *  - Optional headers: HTTP-Referer (for app ranking), X-OpenRouter-Title
     *  - Body: { model, messages, stream?, max_tokens?, temperature?, ... }
     *  - Response (non-streaming): {
     *      id, choices: [{ finish_reason, native_finish_reason,
     *        message: { role, content } }],
     *      usage: { prompt_tokens, completion_tokens, total_tokens, cost? }
     *    }
     *  - Error shape: { error: { code, message, metadata? } }
     *  - Per-choice errors: choices[0].error may also exist
     *  - Reasoning: pass { reasoning: { enabled: true } } to enable
     *  - Preserve reasoning_details from assistant messages for multi-turn
     */
    call: async (model, messages, key) => {
      const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${key}`,
          'Content-Type': 'application/json',
          'HTTP-Referer': 'https://nexusai.chat',
          'X-OpenRouter-Title': 'NexusAI Chat',
        },
        body: JSON.stringify({
          model: model.id,
          messages: messages,
          reasoning: { enabled: true },
        }),
      });

      const data = await resp.json();

      // Top-level error (auth failures, rate limits, invalid model, etc.)
      if (!resp.ok || data.error) {
        const msg = data?.error?.message || `HTTP ${resp.status}`;
        throw new Error(msg);
      }

      // Per-choice error (model-level failures routed through OpenRouter)
      const choice = data.choices?.[0];
      if (!choice) throw new Error('No choices returned from OpenRouter');
      if (choice.error) {
        throw new Error(choice.error.message || 'Model returned an error via OpenRouter');
      }

      // Extract the full message (content + reasoning_details for preservation)
      const assistantMsg = choice.message;
      const content = assistantMsg?.content;
      if (content === null || content === undefined || content === '') {
        throw new Error('Model returned empty content');
      }

      // Return both content and reasoning_details so we can preserve them in history
      return {
        content: content,
        reasoning_details: assistantMsg?.reasoning_details || null,
      };
    },
  },

  huggingface: {
    name: 'Hugging Face',
    cls: 'hf',
    placeholder: 'hf_…',
    hint: 'Get your token at huggingface.co/settings/tokens',
    call: async (model, messages, key) => {
      const resp = await fetch(
        `https://api-inference.huggingface.co/models/${model.id}/v1/chat/completions`,
        {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${key}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            model: model.id,
            messages,
            max_tokens: 2048,
          }),
        }
      );
      const data = await resp.json();
      if (!resp.ok) throw new Error(data?.error || data?.message || `HTTP ${resp.status}`);
      return data.choices?.[0]?.message?.content || 'No response received.';
    },
  },

  anthropic: {
    name: 'Anthropic',
    cls: 'an',
    placeholder: 'sk-ant-api03-…',
    hint: 'Get your key at console.anthropic.com',
    call: async (model, messages, key) => {
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'x-api-key': key,
          'Content-Type': 'application/json',
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: model.id,
          max_tokens: 4096,
          messages,
        }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data?.error?.message || `HTTP ${resp.status}`);
      return data.content?.map(b => b.text).join('') || 'No response received.';
    },
  },

  openai: {
    name: 'OpenAI',
    cls: 'oa',
    placeholder: 'sk-proj-…',
    hint: 'Get your key at platform.openai.com/api-keys',
    call: async (model, messages, key) => {
      const resp = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${key}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ model: model.id, messages }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data?.error?.message || `HTTP ${resp.status}`);
      return data.choices?.[0]?.message?.content || 'No response received.';
    },
  },

  xai: {
    name: 'xAI (Grok)',
    cls: 'xi',
    placeholder: 'xai-…',
    hint: 'Get your key at console.x.ai',
    call: async (model, messages, key) => {
      const resp = await fetch('https://api.x.ai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${key}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ model: model.id, messages }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data?.error?.message || `HTTP ${resp.status}`);
      return data.choices?.[0]?.message?.content || 'No response received.';
    },
  },
};

/* ═══════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════ */
let apiKeys = {}, selectedModel = null, chats = [], activeChatId = null, isGenerating = false;

try {
  apiKeys = JSON.parse(localStorage.getItem('nex_keys') || '{}');
  chats = JSON.parse(localStorage.getItem('nex_chats') || '[]');
  const lm = localStorage.getItem('nex_model');
  if (lm) selectedModel = MODELS.find(m => m.id === lm) || null;
} catch(e){}

const saveKeys = () => localStorage.setItem('nex_keys', JSON.stringify(apiKeys));
const saveChats = () => localStorage.setItem('nex_chats', JSON.stringify(chats));
const esc = s => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML };
const refreshIcons = () => { if(typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons(); };

/* ═══════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════ */
function init(){
  renderChatList(); buildDropdown(); updateSelDisplay(); renderMessages();
  refreshIcons();
}

/* ═══════════════════════════════════════════
   SIDEBAR
   ═══════════════════════════════════════════ */
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('collapsed') }

function newChat(){
  const c = { id:Date.now().toString(), title:'New Chat', messages:[] };
  chats.unshift(c); activeChatId=c.id;
  saveChats(); renderChatList(); renderMessages();
}

function loadChat(id){ activeChatId=id; renderChatList(); renderMessages() }

function deleteChat(id,e){
  e.stopPropagation();
  chats=chats.filter(c=>c.id!==id);
  if(activeChatId===id) activeChatId=chats[0]?.id||null;
  saveChats(); renderChatList(); renderMessages();
}

function renderChatList(){
  const el=document.getElementById('chatList');
  if(!chats.length){
    el.innerHTML='<div style="padding:24px 16px;text-align:center;color:var(--text-3);font-size:11.5px">No conversations yet</div>';
    return;
  }
  el.innerHTML=chats.map(c=>`
    <div class="chat-item ${c.id===activeChatId?'active':''}" onclick="loadChat('${c.id}')">
      <i data-lucide="message-square" class="lucide-sm"></i>
      <span class="chat-title">${esc(c.title)}</span>
      <button class="delete-chat" onclick="deleteChat('${c.id}',event)"><i data-lucide="trash-2" class="lucide-sm"></i></button>
    </div>`).join('');
  refreshIcons();
}

/* ═══════════════════════════════════════════
   MODEL DROPDOWN
   ═══════════════════════════════════════════ */
function toggleDD(e){
  e.stopPropagation();
  const dd=document.getElementById('modelDD'), sel=document.getElementById('modelSel');
  const show=dd.classList.toggle('show'); sel.classList.toggle('open',show);
  if(show){ document.getElementById('ddSearch').value=''; filterModels(''); setTimeout(()=>document.getElementById('ddSearch').focus(),50) }
}
document.addEventListener('click',()=>{
  document.getElementById('modelDD').classList.remove('show');
  document.getElementById('modelSel').classList.remove('open');
});

function buildDropdown(){
  const container=document.getElementById('ddList'), grouped={};
  MODELS.forEach(m=>{ (grouped[m.provider]=grouped[m.provider]||[]).push(m) });
  let h='';
  for(const [prov,models] of Object.entries(grouped)){
    const p=PROVIDERS[prov];
    // For OpenRouter, split into Free and Paid sub-sections
    if(prov === 'openrouter'){
      const freeModels = models.filter(m => m.tag === 'Free' || m.tag === 'Auto');
      const paidModels = models.filter(m => m.tag !== 'Free' && m.tag !== 'Auto');
      if(freeModels.length){
        h+=`<div class="prov-group" data-prov="${prov}">
          <div class="prov-label"><span class="prov-dot dot-${p.cls}"></span>${p.name} — Free ($0)</div>`;
        freeModels.forEach(m => renderModelOpt(m, prov, p));
        h+='</div>';
      }
      if(paidModels.length){
        h+=`<div class="prov-group" data-prov="${prov}">
          <div class="prov-label"><span class="prov-dot dot-${p.cls}"></span>${p.name} — Paid</div>`;
        paidModels.forEach(m => renderModelOpt(m, prov, p));
        h+='</div>';
      }
    } else {
      h+=`<div class="prov-group" data-prov="${prov}">
        <div class="prov-label"><span class="prov-dot dot-${p.cls}"></span>${p.name}</div>`;
      models.forEach(m => renderModelOpt(m, prov, p));
      h+='</div>';
    }
  }
  function renderModelOpt(m, prov, p){
    const hasKey=!!apiKeys[prov];
    const ctxBadge = m.ctx ? `<span style="font-size:8px;color:var(--text-3);margin-left:auto;font-family:'JetBrains Mono',monospace">${m.ctx}</span>` : '';
    h+=`<div class="mod-opt ${selectedModel?.id===m.id?'selected':''}" data-mid="${m.id}" data-mname="${m.name.toLowerCase()}" onclick="pickModel('${m.id}',event)">
      <span class="mod-name">${m.name}</span>
      <span class="mod-tag bg-${p.cls}">${m.tag}</span>
      ${ctxBadge}
      ${!hasKey?'<i data-lucide="lock" class="lucide-sm lock-ind"></i>':''}
    </div>`;
  }
  container.innerHTML=h; refreshIcons();
}

function filterModels(q){
  q=q.toLowerCase();
  document.querySelectorAll('.mod-opt').forEach(el=>{el.style.display=el.dataset.mname.includes(q)?'':'none'});
  document.querySelectorAll('.prov-group').forEach(g=>{g.style.display=[...g.querySelectorAll('.mod-opt')].some(o=>o.style.display!=='none')?'':'none'});
}

function pickModel(id,e){
  e.stopPropagation();
  const m=MODELS.find(x=>x.id===id); if(!m)return;
  selectedModel=m; localStorage.setItem('nex_model',m.id);
  updateSelDisplay(); buildDropdown();
  document.getElementById('modelDD').classList.remove('show');
  document.getElementById('modelSel').classList.remove('open');
  if(!apiKeys[m.provider]) showKeyPrompt(m);
}

function updateSelDisplay(){
  const el=document.getElementById('selDisplay');
  if(!selectedModel){el.textContent='Select a model…';return}
  const p=PROVIDERS[selectedModel.provider];
  el.innerHTML=`<span style="display:flex;align-items:center;gap:8px"><span class="prov-badge bg-${p.cls}">${p.name}</span>${selectedModel.name}</span>`;
}

/* ═══════════════════════════════════════════
   INLINE KEY PROMPT
   ═══════════════════════════════════════════ */
function showKeyPrompt(model){
  const p=PROVIDERS[model.provider];
  document.querySelectorAll('.key-prompt').forEach(e=>e.remove());
  const wrap=document.getElementById('msgWrap'), div=document.createElement('div');
  div.className='key-prompt';
  div.innerHTML=`
    <div class="key-prompt-head"><i data-lucide="shield-alert"></i> API Key Required — ${p.name}</div>
    <p>${p.hint}</p>
    <div class="key-row">
      <input type="password" class="key-input" placeholder="${p.placeholder}" id="inlineKeyIn"
        onkeydown="if(event.key==='Enter')saveInlineKey('${model.provider}')">
      <button class="vis-btn" onclick="toggleInlineVis()"><i data-lucide="eye" class="lucide-sm"></i></button>
      <button class="save-btn" onclick="saveInlineKey('${model.provider}')">Connect</button>
    </div>`;
  wrap.appendChild(div); refreshIcons();
  document.getElementById('chatArea').scrollTop=document.getElementById('chatArea').scrollHeight;
  setTimeout(()=>document.getElementById('inlineKeyIn')?.focus(),80);
}

function toggleInlineVis(){
  const inp=document.getElementById('inlineKeyIn');
  if(inp) inp.type=inp.type==='password'?'text':'password';
}

function saveInlineKey(prov){
  const inp=document.getElementById('inlineKeyIn'), v=inp?.value?.trim();
  if(!v)return;
  apiKeys[prov]=v; saveKeys();
  document.querySelectorAll('.key-prompt').forEach(e=>e.remove());
  buildDropdown(); updateSelDisplay();
  showToast('Key saved — ready to chat!','green');
}

/* ═══════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════ */
function openModal(){
  const body=document.getElementById('modalBody');
  body.innerHTML=Object.entries(PROVIDERS).map(([k,p])=>{
    const has=!!apiKeys[k];
    return `<div class="key-group">
      <div class="key-label">
        <span class="key-icon clr-${p.cls}">${p.name[0]}</span>
        <span class="kn">${p.name}</span>
        <span class="key-status ${has?'on':'off'}">
          <i data-lucide="${has?'check-circle':'circle-off'}"></i>${has?'Connected':'Not set'}
        </span>
      </div>
      <div class="key-row">
        <input type="password" class="key-input" id="mk_${k}" value="${apiKeys[k]||''}" placeholder="${p.placeholder}">
        <button class="vis-btn" onclick="toggleMVis('mk_${k}')"><i data-lucide="eye" class="lucide-sm"></i></button>
        <button class="save-btn" onclick="saveModalKey('${k}')">Save</button>
      </div>
      <div class="key-hint">${p.hint}</div>
    </div>`;
  }).join('');
  document.getElementById('apiModal').classList.add('show'); refreshIcons();
}
function closeModal(){document.getElementById('apiModal').classList.remove('show')}
function toggleMVis(id){const el=document.getElementById(id);el.type=el.type==='password'?'text':'password'}
function saveModalKey(prov){
  const el=document.getElementById('mk_'+prov),v=el.value.trim();
  if(v) apiKeys[prov]=v; else delete apiKeys[prov];
  saveKeys(); buildDropdown(); openModal();
}

/* ═══════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════ */
function showToast(msg,color){
  const t=document.getElementById('toast'),s=document.getElementById('toastMsg');
  s.textContent=msg;
  t.style.color=color==='green'?'var(--green)':'var(--red)';
  t.classList.add('show');
  clearTimeout(t._tid); t._tid=setTimeout(()=>t.classList.remove('show'),3500);
}

/* ═══════════════════════════════════════════
   MESSAGES
   ═══════════════════════════════════════════ */
function getChat(){return chats.find(c=>c.id===activeChatId)}

function renderMessages(){
  const wrap=document.getElementById('msgWrap'), chat=getChat();
  if(!chat||!chat.messages.length){
    wrap.innerHTML=`
      <div class="welcome">
        <div class="welcome-glyph"><i data-lucide="sparkles" class="lucide-xl"></i></div>
        <h2>What can I help with?</h2>
        <p>Pick a model above and start chatting. Supports OpenRouter, Hugging Face, Claude, GPT, Grok and more.</p>
        <div class="chips">
          <div class="chip" onclick="insertPrompt('Explain quantum computing in simple terms')"><i data-lucide="atom" class="lucide-sm"></i>Quantum computing</div>
          <div class="chip" onclick="insertPrompt('Write a Python quicksort implementation')"><i data-lucide="code" class="lucide-sm"></i>Quicksort</div>
          <div class="chip" onclick="insertPrompt('Compare React vs Vue vs Svelte')"><i data-lucide="git-compare-arrows" class="lucide-sm"></i>Framework compare</div>
          <div class="chip" onclick="insertPrompt('Write a creative short story about time travel')"><i data-lucide="book-open" class="lucide-sm"></i>Short story</div>
        </div>
      </div>`;
    refreshIcons(); return;
  }
  wrap.innerHTML=chat.messages.map(m=>{
    const isUser=m.role==='user';
    const reasoningHtml = (!isUser && m.reasoning_details) ?
      `<details class="reasoning-block"><summary><i data-lucide="brain" class="lucide-sm"></i> Reasoning</summary><div class="reasoning-content">${formatMsg(
        Array.isArray(m.reasoning_details)
          ? m.reasoning_details.map(r => r.content || r.text || '').join('')
          : (typeof m.reasoning_details === 'string' ? m.reasoning_details : JSON.stringify(m.reasoning_details))
      )}</div></details>` : '';
    return `<div class="msg ${m.role}">
      <div class="msg-avatar"><i data-lucide="${isUser?'user':'sparkles'}" class="lucide-sm"></i></div>
      <div>
        ${reasoningHtml}
        <div class="msg-body">${formatMsg(m.content)}</div>
        ${m.model?`<div class="msg-meta"><i data-lucide="cpu" class="lucide-sm"></i>${esc(m.model)}</div>`:''}
      </div>
    </div>`;
  }).join('');
  refreshIcons();
  document.getElementById('chatArea').scrollTop=document.getElementById('chatArea').scrollHeight;
}

function formatMsg(text){
  let s=esc(text);
  s=s.replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/\*(.+?)\*/g,'<em>$1</em>');
  s=s.replace(/\n/g,'<br>');
  return s;
}

function insertPrompt(text){
  document.getElementById('chatInput').value=text;
  autoResize(document.getElementById('chatInput'));
  sendMessage();
}

/* ═══════════════════════════════════════════
   SEND
   ═══════════════════════════════════════════ */
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,140)+'px'}

async function sendMessage(){
  const inp=document.getElementById('chatInput'), text=inp.value.trim();
  if(!text||isGenerating)return;

  if(!selectedModel){showToast('Please select a model first.','red');return}
  const prov=PROVIDERS[selectedModel.provider];
  if(!apiKeys[selectedModel.provider]){showKeyPrompt(selectedModel);return}

  if(!activeChatId) newChat();
  const chat=getChat();

  chat.messages.push({role:'user',content:text});
  if(chat.messages.length===1){
    chat.title=text.slice(0,45)+(text.length>45?'…':'');
    renderChatList();
  }
  inp.value=''; autoResize(inp);
  renderMessages(); showTyping();
  isGenerating=true; document.getElementById('sendBtn').disabled=true;

  try{
    // Build API messages — for OpenRouter, preserve reasoning_details in assistant msgs
    const isOR = selectedModel.provider === 'openrouter';
    const apiMsgs = chat.messages
      .filter(m => m.role==='user' || m.role==='assistant')
      .map(m => {
        const msg = { role: m.role, content: m.content };
        // Per OpenRouter docs: pass back reasoning_details unmodified for multi-turn
        if (isOR && m.role === 'assistant' && m.reasoning_details) {
          msg.reasoning_details = m.reasoning_details;
        }
        return msg;
      });

    const reply = await prov.call(selectedModel, apiMsgs, apiKeys[selectedModel.provider]);

    // OpenRouter returns { content, reasoning_details }, others return a string
    if (typeof reply === 'object' && reply !== null && reply.content !== undefined) {
      const assistantMsg = { role:'assistant', content: reply.content, model: selectedModel.name };
      // Store reasoning_details so we can pass them back in future turns
      if (reply.reasoning_details) {
        assistantMsg.reasoning_details = reply.reasoning_details;
      }
      chat.messages.push(assistantMsg);
    } else {
      chat.messages.push({ role:'assistant', content: reply, model: selectedModel.name });
    }
  }catch(err){
    chat.messages.push({role:'assistant',content:`⚠️ **Error:** ${err.message}`,model:selectedModel.name});
    showToast(err.message,'red');
  }

  isGenerating=false; document.getElementById('sendBtn').disabled=false;
  saveChats(); renderMessages();
}

function showTyping(){
  const wrap=document.getElementById('msgWrap'), div=document.createElement('div');
  div.className='msg assistant'; div.id='typingEl';
  div.innerHTML=`<div class="msg-avatar"><i data-lucide="sparkles" class="lucide-sm"></i></div>
    <div class="msg-body"><div class="typing"><span></span><span></span><span></span></div></div>`;
  wrap.appendChild(div); refreshIcons();
  document.getElementById('chatArea').scrollTop=document.getElementById('chatArea').scrollHeight;
}

/* ═══ BOOT ═══ */
function bootApp(){
  if(typeof lucide !== 'undefined' && lucide.createIcons){
    init();
  } else {
    // lucide not loaded yet — render without icons first, retry when available
    renderChatList(); buildDropdown(); updateSelDisplay(); renderMessages();
    const check = setInterval(()=>{
      if(typeof lucide !== 'undefined' && lucide.createIcons){
        clearInterval(check);
        lucide.createIcons();
      }
    }, 200);
    // Give up after 10s
    setTimeout(()=>clearInterval(check), 10000);
  }
}

// Load Lucide dynamically to guarantee sequencing
(function loadLucide(){
  const s = document.createElement('script');
  s.src = 'https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js';
  s.onload = function(){ bootApp(); };
  s.onerror = function(){
    // Try alternate CDN
    const s2 = document.createElement('script');
    s2.src = 'https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js';
    s2.onload = function(){ bootApp(); };
    s2.onerror = function(){
      // Run without icons
      console.warn('Lucide icons failed to load — running without icons.');
      window.lucide = { createIcons: function(){} };
      bootApp();
    };
    document.body.appendChild(s2);
  };
  document.body.appendChild(s);
})();
</script>
