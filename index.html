<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDIW.cc - Premium Tools Marketplace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background particles */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(99, 102, 241, 0.3);
            border-radius: 50%;
            animation: float 20s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }

        /* Navigation Bar */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
            animation: slideDown 0.8s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .nav-links {
            display: flex;
            gap: 3rem;
            list-style: none;
        }

        .nav-links a {
            color: #e0e0e0;
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            position: relative;
            padding: 0.5rem 0;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a:hover {
            color: #a855f7;
        }

        /* Hero Section */
        .hero {
            margin-top: 100px;
            padding: 4rem 5%;
            text-align: center;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .hero p {
            font-size: 1.3rem;
            color: #a0a0a0;
            margin-bottom: 3rem;
        }

        /* Search and Filter */
        .search-container {
            max-width: 800px;
            margin: 0 auto 4rem;
            display: flex;
            gap: 1rem;
            animation: fadeIn 1.2s ease;
        }

        .search-box {
            flex: 1;
            padding: 1rem 1.5rem;
            background: rgba(30, 30, 50, 0.5);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 50px;
            color: #e0e0e0;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: #6366f1;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }

        .filter-btn {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .filter-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.5);
        }

        /* Products Grid */
        .products-grid {
            padding: 2rem 5%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .product-card {
            background: rgba(30, 30, 50, 0.5);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }

        .product-card:nth-child(1) { animation-delay: 0.1s; }
        .product-card:nth-child(2) { animation-delay: 0.2s; }
        .product-card:nth-child(3) { animation-delay: 0.3s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .product-card:hover::before {
            left: 100%;
        }

        .product-card:hover {
            transform: translateY(-10px);
            border-color: #6366f1;
            box-shadow: 0 20px 50px rgba(99, 102, 241, 0.3);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 1.5rem;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.05);
        }

        .product-title {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        .product-description {
            color: #a0a0a0;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #10b981;
        }

        .download-btn {
            padding: 0.8rem 2rem;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.5);
        }

        /* Contact Section */
        .contact-section {
            padding: 5rem 5%;
            text-align: center;
            display: none;
        }

        .contact-section.active {
            display: block;
            animation: fadeIn 0.6s ease;
        }

        .contact-content {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(30, 30, 50, 0.5);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .contact-content h2 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .contact-info {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin-bottom: 1rem;
        }

        .no-results {
            text-align: center;
            padding: 4rem;
            font-size: 1.5rem;
            color: #a0a0a0;
            display: none;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .nav-links { gap: 1.5rem; }
            .products-grid { grid-template-columns: 1fr; }
            .search-container { flex-direction: column; }
        }
    </style>
</head>
<body>
    <!-- Background Particles -->
    <div class="bg-particles" id="particles"></div>

    <!-- Navigation -->
    <nav>
        <div class="logo" onclick="showProducts()">FDIW.cc</div>
        <ul class="nav-links">
            <li><a href="#" onclick="showProducts(); return false;">Products</a></li>
            <li><a href="#" onclick="showContact(); return false;">Contact Me</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <div class="hero" id="heroSection">
        <h1>Premium Tools Marketplace</h1>
        <p>Download powerful tools crafted with precision</p>
        
        <div class="search-container">
            <input type="text" class="search-box" id="searchBox" placeholder="Search for tools..." onkeyup="filterProducts()">
            <button class="filter-btn" onclick="filterProducts()">Search</button>
        </div>
    </div>

    <!-- Products Grid -->
    <div class="products-grid" id="productsGrid"></div>
    <div class="no-results" id="noResults">No tools found matching your search.</div>

    <!-- Contact Section -->
    <div class="contact-section" id="contactSection">
        <div class="contact-content">
            <h2>Get In Touch</h2>
            <p class="contact-info">Have questions or want to collaborate?</p>
            <p class="contact-info">Reach out to me through GitHub or submit feedback.</p>
            <p class="contact-info" style="margin-top: 2rem; color: #6366f1;">📧 Contact via GitHub: github.com/fd-iw</p>
        </div>
    </div>

    <script>
        const products = [
            {
                name: 'Wavy',
                description: 'A powerful tool designed to streamline your workflow with advanced features and intuitive controls.',
                image: 'https://raw.githubusercontent.com/fd-iw/Downloads/refs/heads/main/Wavy.png',
                download: 'https://raw.githubusercontent.com/fd-iw/Downloads/refs/heads/main/Wavy.zip',
                price: 'FREE'
            },
            {
                name: 'CantKick',
                description: 'Robust protection tool with cutting-edge security features to keep you safe and secure.',
                image: 'https://raw.githubusercontent.com/fd-iw/Downloads/refs/heads/main/CantKick.png',
                download: 'https://raw.githubusercontent.com/fd-iw/Downloads/refs/heads/main/CantKick.zip',
                price: 'FREE'
            },
            {
                name: 'TCon',
                description: 'Advanced connectivity solution that provides seamless integration and lightning-fast performance.',
                image: 'https://raw.githubusercontent.com/fd-iw/Downloads/refs/heads/main/TCon.png',
                download: 'https://raw.githubusercontent.com/fd-iw/Downloads/refs/heads/main/TCon.zip',
                price: 'FREE'
            }
        ];

        // Generate background particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
            particlesContainer.appendChild(particle);
        }

        // Render products
        function renderProducts(productsToRender) {
            const grid = document.getElementById('productsGrid');
            const noResults = document.getElementById('noResults');
            
            if (productsToRender.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            noResults.style.display = 'none';
            grid.innerHTML = '';

            productsToRender.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${product.image}" alt="${product.name}" class="product-image" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22200%22%3E%3Crect fill=%22%231a1a2e%22 width=%22400%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%236366f1%22 font-size=%2224%22 font-family=%22Arial%22%3E${product.name}%3C/text%3E%3C/svg%3E'">
                    <h3 class="product-title">${product.name}</h3>
                    <p class="product-description">${product.description}</p>
                    <div class="product-footer">
                        <span class="price">${product.price}</span>
                        <button class="download-btn" onclick="downloadTool('${product.download}', '${product.name}')">Download</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Filter products
        function filterProducts() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            const filtered = products.filter(product => 
                product.name.toLowerCase().includes(searchTerm) ||
                product.description.toLowerCase().includes(searchTerm)
            );
            renderProducts(filtered);
        }

        // Download tool
        function downloadTool(url, name) {
            const a = document.createElement('a');
            a.href = url;
            a.download = name + '.zip';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Navigation functions
        function showProducts() {
            document.getElementById('heroSection').style.display = 'block';
            document.getElementById('productsGrid').style.display = 'grid';
            document.getElementById('contactSection').classList.remove('active');
            renderProducts(products);
        }

        function showContact() {
            document.getElementById('heroSection').style.display = 'none';
            document.getElementById('productsGrid').style.display = 'none';
            document.getElementById('noResults').style.display = 'none';
            document.getElementById('contactSection').classList.add('active');
        }

        // Initialize
        renderProducts(products);
    </script>
</body>
</html>
