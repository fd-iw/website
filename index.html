<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Slider</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background-color: #ffffff;
            transition: background-color 0.1s ease;
            font-family: Arial, sans-serif;
        }

        .slider-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: auto;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        body:hover .slider-container {
            transform: translateY(0);
        }

        .slider-label {
            color: #333;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        .slider-input {
            width: 300px;
            height: 8px;
            cursor: pointer;
            accent-color: #666;
        }

        .color-display {
            display: none;
        }

        .reset-button {
            display: none;
        }
    </style>
</head>
<body>
    <div class="slider-container">
        <span class="slider-label">Color:</span>
        <input 
            type="range" 
            class="slider-input" 
            min="0" 
            max="360" 
            value="0"
            id="colorSlider"
        >
        <div class="color-display" id="colorDisplay"></div>
        <button class="reset-button" id="resetButton">Reset</button>
    </div>

    <script>
        const slider = document.getElementById('colorSlider');
        const colorDisplay = document.getElementById('colorDisplay');
        const resetButton = document.getElementById('resetButton');
        const body = document.body;

        function updateColor(value) {
            // Convert slider value (0-360) to RGB values (255-0)
            // 0 = white (255,255,255)
            // 180 = gray (127,127,127)
            // 360 = black (0,0,0)
            
            const rgbValue = Math.round(255 - (value / 360) * 255);
            const color = `rgb(${rgbValue}, ${rgbValue}, ${rgbValue})`;
            
            body.style.backgroundColor = color;
            colorDisplay.style.backgroundColor = color;
        }

        function resetColor() {
            slider.value = 0;
            updateColor(0);
        }

        slider.addEventListener('input', (e) => {
            updateColor(e.target.value);
        });

        resetButton.addEventListener('click', resetColor);

        // Initialize
        updateColor(0);
    </script>
</body>
</html>
