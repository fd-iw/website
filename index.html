<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChartView Pro - Advanced Trading Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #242424;
            --border-color: #2a2a2a;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --text-tertiary: #6a6a6a;
            --accent-green: #00c896;
            --accent-red: #ff4757;
            --accent-blue: #4a9eff;
            --accent-yellow: #feca57;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .ticker-info {
            display: flex;
            gap: 24px;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
        }

        .ticker-symbol {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .ticker-price {
            font-size: 20px;
            font-weight: 600;
        }

        .ticker-change {
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(0, 200, 150, 0.1);
        }

        .ticker-change.positive {
            color: var(--accent-green);
        }

        .ticker-change.negative {
            color: var(--accent-red);
            background: rgba(255, 71, 87, 0.1);
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        /* Main Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            grid-template-rows: 1fr auto;
            flex: 1;
            overflow: hidden;
        }

        /* Chart Section */
        .chart-section {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .chart-toolbar {
            padding: 12px 16px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .toolbar-btn {
            padding: 6px 12px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            border-radius: 4px;
            transition: all 0.2s;
            font-weight: 500;
        }

        .toolbar-btn:hover, .toolbar-btn.active {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .chart-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #chart-canvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-section {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-tertiary);
            margin-bottom: 12px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-label {
            color: var(--text-secondary);
        }

        .stat-value {
            color: var(--text-primary);
            font-weight: 500;
        }

        .orderbook {
            flex: 1;
            overflow: hidden;
        }

        .orderbook-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 6px 16px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            position: relative;
        }

        .orderbook-row.ask {
            color: var(--accent-red);
        }

        .orderbook-row.bid {
            color: var(--accent-green);
        }

        .orderbook-bg {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            opacity: 0.1;
        }

        .orderbook-row.ask .orderbook-bg {
            background: var(--accent-red);
        }

        .orderbook-row.bid .orderbook-bg {
            background: var(--accent-green);
        }

        /* Bottom Panel */
        .bottom-panel {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            grid-column: 1 / -1;
            height: 240px;
        }

        .trades-panel {
            flex: 1;
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .panel-header {
            padding: 12px 16px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            font-weight: 600;
        }

        .trade-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 8px 16px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .trade-row.buy {
            color: var(--accent-green);
        }

        .trade-row.sell {
            color: var(--accent-red);
        }

        .time {
            color: var(--text-tertiary);
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-row, .orderbook-row, .trade-row {
            animation: slideIn 0.3s ease-out;
        }

        /* Crosshair */
        .crosshair-line {
            position: absolute;
            pointer-events: none;
            opacity: 0.3;
        }

        .crosshair-h {
            height: 1px;
            background: var(--text-secondary);
            width: 100%;
        }

        .crosshair-v {
            width: 1px;
            background: var(--text-secondary);
            height: 100%;
        }

        .price-label {
            position: absolute;
            right: 0;
            padding: 4px 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">ChartView Pro</div>
            <div class="ticker-info">
                <span class="ticker-symbol">BTC/USDT</span>
                <span class="ticker-price" id="current-price">43,250.00</span>
                <span class="ticker-change positive" id="price-change">+1,234.50 (+2.94%)</span>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn">Trade</button>
                <button class="nav-btn">Markets</button>
                <button class="nav-btn">Watchlist</button>
            </div>
        </div>

        <div class="main-layout">
            <div class="chart-section">
                <div class="chart-toolbar">
                    <button class="toolbar-btn active">1m</button>
                    <button class="toolbar-btn">5m</button>
                    <button class="toolbar-btn">15m</button>
                    <button class="toolbar-btn">1h</button>
                    <button class="toolbar-btn">4h</button>
                    <button class="toolbar-btn">1D</button>
                    <div style="width: 1px; height: 20px; background: var(--border-color); margin: 0 8px;"></div>
                    <button class="toolbar-btn">Indicators</button>
                    <button class="toolbar-btn">Settings</button>
                </div>
                <div class="chart-container">
                    <canvas id="chart-canvas"></canvas>
                </div>
            </div>

            <div class="sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-title">Market Stats</div>
                    <div class="stat-row">
                        <span class="stat-label">24h High</span>
                        <span class="stat-value" id="high-24h">44,125.00</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">24h Low</span>
                        <span class="stat-value" id="low-24h">41,890.00</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">24h Volume</span>
                        <span class="stat-value">12,345.67 BTC</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Market Cap</span>
                        <span class="stat-value">$850.2B</span>
                    </div>
                </div>
                <div class="orderbook">
                    <div class="sidebar-section" style="border-bottom: none; padding-bottom: 8px;">
                        <div class="sidebar-title">Order Book</div>
                    </div>
                    <div id="orderbook-container"></div>
                </div>
            </div>

            <div class="bottom-panel">
                <div class="trades-panel">
                    <div class="panel-header">Recent Trades</div>
                    <div id="trades-container"></div>
                </div>
                <div class="trades-panel">
                    <div class="panel-header">Market Depth</div>
                    <canvas id="depth-chart" style="width: 100%; height: calc(100% - 45px);"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Candlestick data generator with smooth transitions
        class CandlestickGenerator {
            constructor(startPrice = 43000, volatility = 0.002) {
                this.currentPrice = startPrice;
                this.volatility = volatility;
                this.candles = [];
                this.timeframe = 60000; // 1 minute
            }

            generateCandle(timestamp) {
                const open = this.currentPrice;
                
                // Generate realistic price movements
                const ticks = 20;
                let high = open;
                let low = open;
                let close = open;
                
                for (let i = 0; i < ticks; i++) {
                    const change = (Math.random() - 0.48) * this.currentPrice * this.volatility;
                    close += change;
                    high = Math.max(high, close);
                    low = Math.min(low, close);
                }
                
                this.currentPrice = close;
                
                return {
                    timestamp,
                    open,
                    high,
                    low,
                    close,
                    volume: Math.random() * 50 + 10
                };
            }

            generateInitialData(count = 100) {
                const now = Date.now();
                for (let i = count; i > 0; i--) {
                    const timestamp = now - (i * this.timeframe);
                    this.candles.push(this.generateCandle(timestamp));
                }
                return this.candles;
            }
        }

        // Chart renderer
        class ChartRenderer {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.candles = [];
                this.padding = { top: 20, right: 80, bottom: 40, left: 60 };
                this.visibleCandles = 50;
                this.candleWidth = 8;
                this.candleSpacing = 4;
                
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width * window.devicePixelRatio;
                this.canvas.height = rect.height * window.devicePixelRatio;
                this.canvas.style.width = rect.width + 'px';
                this.canvas.style.height = rect.height + 'px';
                this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                this.width = rect.width;
                this.height = rect.height;
            }

            setData(candles) {
                this.candles = candles;
                this.draw();
            }

            draw() {
                this.ctx.clearRect(0, 0, this.width, this.height);
                
                if (this.candles.length === 0) return;
                
                const visible = this.candles.slice(-this.visibleCandles);
                
                // Calculate price range
                let minPrice = Infinity;
                let maxPrice = -Infinity;
                
                visible.forEach(candle => {
                    minPrice = Math.min(minPrice, candle.low);
                    maxPrice = Math.max(maxPrice, candle.high);
                });
                
                const priceRange = maxPrice - minPrice;
                const padding = priceRange * 0.1;
                minPrice -= padding;
                maxPrice += padding;
                
                const chartWidth = this.width - this.padding.left - this.padding.right;
                const chartHeight = this.height - this.padding.top - this.padding.bottom;
                
                // Draw grid
                this.drawGrid(chartHeight, minPrice, maxPrice);
                
                // Draw candles
                visible.forEach((candle, i) => {
                    const x = this.padding.left + (i * (this.candleWidth + this.candleSpacing));
                    this.drawCandle(candle, x, chartHeight, minPrice, maxPrice);
                });
                
                // Draw axes
                this.drawAxes(minPrice, maxPrice, chartHeight);
            }

            drawGrid(chartHeight, minPrice, maxPrice) {
                this.ctx.strokeStyle = '#2a2a2a';
                this.ctx.lineWidth = 1;
                
                // Horizontal lines
                for (let i = 0; i <= 5; i++) {
                    const y = this.padding.top + (chartHeight / 5) * i;
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.padding.left, y);
                    this.ctx.lineTo(this.width - this.padding.right, y);
                    this.ctx.stroke();
                }
            }

            drawCandle(candle, x, chartHeight, minPrice, maxPrice) {
                const priceToY = (price) => {
                    const ratio = (maxPrice - price) / (maxPrice - minPrice);
                    return this.padding.top + (chartHeight * ratio);
                };
                
                const openY = priceToY(candle.open);
                const closeY = priceToY(candle.close);
                const highY = priceToY(candle.high);
                const lowY = priceToY(candle.low);
                
                const isGreen = candle.close >= candle.open;
                const color = isGreen ? '#00c896' : '#ff4757';
                
                // Draw wick
                this.ctx.strokeStyle = color;
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                this.ctx.moveTo(x + this.candleWidth / 2, highY);
                this.ctx.lineTo(x + this.candleWidth / 2, lowY);
                this.ctx.stroke();
                
                // Draw body
                this.ctx.fillStyle = color;
                const bodyY = Math.min(openY, closeY);
                const bodyHeight = Math.abs(closeY - openY) || 1;
                this.ctx.fillRect(x, bodyY, this.candleWidth, bodyHeight);
            }

            drawAxes(minPrice, maxPrice, chartHeight) {
                this.ctx.fillStyle = '#a0a0a0';
                this.ctx.font = '11px JetBrains Mono';
                this.ctx.textAlign = 'right';
                
                // Price labels
                for (let i = 0; i <= 5; i++) {
                    const price = maxPrice - ((maxPrice - minPrice) / 5) * i;
                    const y = this.padding.top + (chartHeight / 5) * i;
                    this.ctx.fillText(price.toFixed(2), this.width - this.padding.right + 60, y + 4);
                }
            }
        }

        // Order book generator
        function generateOrderBook(basePrice, depth = 15) {
            const asks = [];
            const bids = [];
            
            for (let i = 0; i < depth; i++) {
                const askPrice = basePrice + (i * (Math.random() * 5 + 5));
                const bidPrice = basePrice - (i * (Math.random() * 5 + 5));
                const askSize = Math.random() * 2 + 0.1;
                const bidSize = Math.random() * 2 + 0.1;
                
                asks.push({ price: askPrice, size: askSize, total: askSize * (i + 1) });
                bids.push({ price: bidPrice, size: bidSize, total: bidSize * (i + 1) });
            }
            
            return { asks, bids };
        }

        // Recent trades generator
        function generateTrades(basePrice, count = 20) {
            const trades = [];
            const now = Date.now();
            
            for (let i = 0; i < count; i++) {
                const isBuy = Math.random() > 0.5;
                const price = basePrice + (Math.random() - 0.5) * 100;
                const size = Math.random() * 0.5 + 0.01;
                const time = new Date(now - (i * 3000));
                
                trades.push({
                    type: isBuy ? 'buy' : 'sell',
                    price: price.toFixed(2),
                    size: size.toFixed(4),
                    time: time.toTimeString().slice(0, 8)
                });
            }
            
            return trades;
        }

        // Initialize
        const generator = new CandlestickGenerator(43000);
        const candles = generator.generateInitialData(100);
        
        const canvas = document.getElementById('chart-canvas');
        const chartRenderer = new ChartRenderer(canvas);
        chartRenderer.setData(candles);
        
        // Update order book
        function updateOrderBook() {
            const orderbook = generateOrderBook(generator.currentPrice);
            const container = document.getElementById('orderbook-container');
            container.innerHTML = '';
            
            // Asks (reverse order)
            orderbook.asks.reverse().forEach(ask => {
                const row = document.createElement('div');
                row.className = 'orderbook-row ask';
                const bgWidth = (ask.size / 2) * 100;
                row.innerHTML = `
                    <span>${ask.price.toFixed(2)}</span>
                    <span>${ask.size.toFixed(4)}</span>
                    <span>${(ask.price * ask.size).toFixed(2)}</span>
                    <div class="orderbook-bg" style="width: ${bgWidth}%"></div>
                `;
                container.appendChild(row);
            });
            
            // Bids
            orderbook.bids.forEach(bid => {
                const row = document.createElement('div');
                row.className = 'orderbook-row bid';
                const bgWidth = (bid.size / 2) * 100;
                row.innerHTML = `
                    <span>${bid.price.toFixed(2)}</span>
                    <span>${bid.size.toFixed(4)}</span>
                    <span>${(bid.price * bid.size).toFixed(2)}</span>
                    <div class="orderbook-bg" style="width: ${bgWidth}%"></div>
                `;
                container.appendChild(row);
            });
        }
        
        // Update trades
        function updateTrades() {
            const trades = generateTrades(generator.currentPrice);
            const container = document.getElementById('trades-container');
            container.innerHTML = '';
            
            trades.forEach(trade => {
                const row = document.createElement('div');
                row.className = `trade-row ${trade.type}`;
                row.innerHTML = `
                    <span>${trade.price}</span>
                    <span>${trade.size}</span>
                    <span class="time">${trade.time}</span>
                `;
                container.appendChild(row);
            });
        }
        
        // Update price header
        function updateHeader() {
            const currentPrice = generator.currentPrice;
            const change = currentPrice - 43000;
            const changePercent = (change / 43000) * 100;
            
            document.getElementById('current-price').textContent = currentPrice.toFixed(2);
            
            const changeEl = document.getElementById('price-change');
            changeEl.textContent = `${change >= 0 ? '+' : ''}${change.toFixed(2)} (${changePercent >= 0 ? '+' : ''}${changePercent.toFixed(2)}%)`;
            changeEl.className = change >= 0 ? 'ticker-change positive' : 'ticker-change negative';
            
            // Update 24h high/low
            const prices = candles.map(c => c.high);
            document.getElementById('high-24h').textContent = Math.max(...prices).toFixed(2);
            document.getElementById('low-24h').textContent = Math.min(...candles.map(c => c.low)).toFixed(2);
        }
        
        // Animate new candles
        function tick() {
            const newCandle = generator.generateCandle(Date.now());
            candles.push(newCandle);
            if (candles.length > 200) candles.shift();
            
            chartRenderer.setData(candles);
            updateHeader();
        }
        
        // Initial updates
        updateOrderBook();
        updateTrades();
        updateHeader();
        
        // Update intervals
        setInterval(tick, 2000);
        setInterval(updateOrderBook, 1000);
        setInterval(updateTrades, 3000);
        
        // Depth chart
        const depthCanvas = document.getElementById('depth-chart');
        const depthCtx = depthCanvas.getContext('2d');
        
        function drawDepthChart() {
            const rect = depthCanvas.parentElement.getBoundingClientRect();
            depthCanvas.width = rect.width * window.devicePixelRatio;
            depthCanvas.height = (rect.height - 45) * window.devicePixelRatio;
            depthCanvas.style.width = rect.width + 'px';
            depthCanvas.style.height = (rect.height - 45) + 'px';
            depthCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            const width = rect.width;
            const height = rect.height - 45;
            
            depthCtx.clearRect(0, 0, width, height);
            
            // Generate depth data
            const midPrice = generator.currentPrice;
            const points = 30;
            const bids = [];
            const asks = [];
            let cumBid = 0;
            let cumAsk = 0;
            
            for (let i = 0; i < points; i++) {
                const bidPrice = midPrice - (i * 20);
                const askPrice = midPrice + (i * 20);
                cumBid += Math.random() * 5 + 2;
                cumAsk += Math.random() * 5 + 2;
                bids.push({ price: bidPrice, cum: cumBid });
                asks.push({ price: askPrice, cum: cumAsk });
            }
            
            const maxCum = Math.max(cumBid, cumAsk);
            
            // Draw bid curve
            depthCtx.beginPath();
            depthCtx.strokeStyle = '#00c896';
            depthCtx.lineWidth = 2;
            
            bids.reverse().forEach((bid, i) => {
                const x = (width / 2) - ((i / points) * (width / 2));
                const y = height - (bid.cum / maxCum) * (height - 20);
                if (i === 0) depthCtx.moveTo(x, y);
                else depthCtx.lineTo(x, y);
            });
            depthCtx.stroke();
            
            // Fill bid area
            depthCtx.lineTo(0, height);
            depthCtx.lineTo(width / 2, height);
            depthCtx.fillStyle = 'rgba(0, 200, 150, 0.1)';
            depthCtx.fill();
            
            // Draw ask curve
            depthCtx.beginPath();
            depthCtx.strokeStyle = '#ff4757';
            depthCtx.lineWidth = 2;
            
            asks.forEach((ask, i) => {
                const x = (width / 2) + ((i / points) * (width / 2));
                const y = height - (ask.cum / maxCum) * (height - 20);
                if (i === 0) depthCtx.moveTo(x, y);
                else depthCtx.lineTo(x, y);
            });
            depthCtx.stroke();
            
            // Fill ask area
            depthCtx.lineTo(width, height);
            depthCtx.lineTo(width / 2, height);
            depthCtx.fillStyle = 'rgba(255, 71, 87, 0.1)';
            depthCtx.fill();
        }
        
        drawDepthChart();
        setInterval(drawDepthChart, 2000);
        window.addEventListener('resize', drawDepthChart);
    </script>
</body>
</html>
