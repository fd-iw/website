<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Grid Background */
        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
            z-index: 0;
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.4) 50%, rgba(0, 0, 0, 0.8) 100%);
            z-index: 1;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(-60px, -60px);
            }
        }

        /* Glow effect orbs */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }

        .glow-orb-1 {
            width: 500px;
            height: 500px;
            background: #ffffff;
            top: -250px;
            right: -250px;
            animation: float1 15s ease-in-out infinite;
        }

        .glow-orb-2 {
            width: 400px;
            height: 400px;
            background: #666666;
            bottom: -200px;
            left: -200px;
            animation: float2 18s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-50px, 50px) scale(1.1); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, -50px) scale(1.15); }
        }

        .container {
            text-align: center;
            padding: 60px 40px;
            max-width: 1000px;
            width: 90%;
            position: relative;
            z-index: 10;
        }

        .logo-container {
            margin-bottom: 80px;
            animation: fadeInDown 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo {
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 8px;
            color: #ffffff;
            position: relative;
            display: inline-block;
            padding: 12px 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.1);
        }

        .logo::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 15px;
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            transform: translateY(-50%);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: translateY(-50%) scale(1); }
            50% { opacity: 0.5; transform: translateY(-50%) scale(0.8); }
        }

        .main-content {
            margin-bottom: 60px;
        }

        h1 {
            font-size: clamp(3rem, 8vw, 7rem);
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: -0.02em;
            line-height: 1.1;
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
            background: linear-gradient(180deg, #ffffff 0%, #999999 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: clamp(1rem, 2vw, 1.4rem);
            color: #999999;
            font-weight: 300;
            letter-spacing: 0.5px;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
        }

        .status-bar {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 28px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
            transition: all 0.3s ease;
        }

        .status-bar:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: statusPulse 2s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.9); }
        }

        .status-text {
            font-size: 0.9rem;
            color: #cccccc;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .decorative-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.8s both;
        }

        .line-top {
            top: 0;
            left: 0;
            right: 0;
        }

        .line-bottom {
            bottom: 0;
            left: 0;
            right: 0;
        }

        /* Scan line effect */
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.1) 50%, 
                transparent 100%);
            animation: scan 8s linear infinite;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes scan {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }

            .logo-container {
                margin-bottom: 60px;
            }

            .logo {
                font-size: 1.3rem;
                letter-spacing: 5px;
                padding: 10px 30px;
            }

            .main-content {
                margin-bottom: 40px;
            }

            .subtitle {
                font-size: 1rem;
                padding: 0 10px;
            }

            .status-bar {
                padding: 12px 24px;
            }

            .glow-orb-1, .glow-orb-2 {
                filter: blur(60px);
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 1.1rem;
                letter-spacing: 4px;
                padding: 8px 24px;
            }

            .status-text {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Grid Background -->
    <div class="grid-background"></div>
    <div class="grid-overlay"></div>
    
    <!-- Glow Orbs -->
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    
    <!-- Scan Line Effect -->
    <div class="scan-line"></div>
    
    <div class="container">
        <div class="decorative-line line-top"></div>
        
        <div class="logo-container">
            <div class="logo">FDIW.CC</div>
        </div>
        
        <div class="main-content">
            <h1>COMING SOON</h1>
            <p class="subtitle">Something extraordinary is in development. We're crafting an experience worth the wait.</p>
        </div>
        
        <div class="status-bar">
            <div class="status-dot"></div>
            <span class="status-text">Under Development</span>
        </div>
        
        <div class="decorative-line line-bottom"></div>
    </div>

    <script>
        // Smooth parallax effect on mouse move
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            
            document.querySelector('.glow-orb-1').style.transform = 
                `translate(${moveX}px, ${moveY}px)`;
            document.querySelector('.glow-orb-2').style.transform = 
                `translate(${-moveX}px, ${-moveY}px)`;
        });

        // Add subtle tilt effect to container
        const container = document.querySelector('.container');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.clientX) / 50;
            const yAxis = (window.innerHeight / 2 - e.clientY) / 50;
            
            container.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
            container.style.transform = 'rotateY(0deg) rotateX(0deg)';
        });
    </script>
</body>
</html>
