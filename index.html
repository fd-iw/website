<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon — FDIW</title>
    <link rel="icon" type="image/svg" href="https://raw.githubusercontent.com/fd-iw/website/refs/heads/main/eye-slash.svg">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Preserving Original Theme Colors */
            --bg-dark: #0f0f0f;
            --bg-light: #1a1a1a;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --text-dark: #666;
            --accent-border: #333;
            --success: #7ec850;
            --error: #ff6b6b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-light) 50%, var(--bg-dark) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Upgrade: Noise Texture Overlay */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Animated background elements (Refined) */
        .bg-element {
            position: fixed;
            border-radius: 50%;
            opacity: 0.4; /* Slightly increased for blur effect */
            filter: blur(80px); /* Upgrade: Softer, more modern blur */
            z-index: 0;
            animation: float 10s ease-in-out infinite;
        }

        .bg-element-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
            top: -150px;
            right: -150px;
        }

        .bg-element-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.02) 0%, transparent 70%);
            bottom: -100px;
            left: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        /* Upgrade: Glass Card Container */
        .card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 60px 40px;
            border-radius: 24px;
            text-align: center;
            z-index: 10;
            max-width: 700px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .domain {
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 24px;
            font-weight: 600;
            display: inline-block;
            padding: 6px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(48px, 6vw, 72px);
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -1.5px;
            background: linear-gradient(135deg, #fff 20%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 18px;
            font-weight: 300;
            color: var(--text-muted);
            margin-bottom: 40px;
            line-height: 1.6;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Upgrade: Countdown Timer */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            font-family: 'Inter', sans-serif;
        }

        .countdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .countdown-value {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }

        .countdown-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-top: 4px;
        }

        /* Signup Section */
        .signup-container {
            display: flex;
            gap: 10px;
            max-width: 420px;
            margin: 0 auto;
            position: relative;
        }

        input[type="email"] {
            flex: 1;
            padding: 16px 20px;
            border: 1px solid var(--accent-border);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
        }

        button {
            padding: 16px 28px;
            background: #fff;
            border: none;
            color: #000;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(255, 255, 255, 0.15);
        }

        button:active {
            transform: translateY(0);
        }
        
        button.loading {
            color: transparent;
            pointer-events: none;
        }

        button.loading::after {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            left: 50%;
            margin-top: -8px;
            margin-left: -8px;
            border: 2px solid rgba(0,0,0,0.3);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            margin-top: 16px;
            font-size: 13px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .message.visible {
            opacity: 1;
        }

        .message.success { color: var(--success); }
        .message.error { color: var(--error); }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 30px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 12px;
        }

        .footer-link {
            color: var(--text-dark);
            text-decoration: none;
            font-size: 20px;
            transition: color 0.3s ease;
        }

        .footer-link:hover {
            color: #fff;
        }

        .copyright {
            font-size: 12px;
            color: #444;
            letter-spacing: 0.5px;
        }

        @media (max-width: 600px) {
            .card { padding: 40px 24px; width: 95%; }
            h1 { font-size: 42px; }
            .signup-container { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="bg-element bg-element-1"></div>
    <div class="bg-element bg-element-2"></div>

    <main class="card">
        <div class="domain">FDIW.CC</div>
        
        <h1>Coming Soon</h1>
        
        <p class="subtitle">Something remarkable is on the horizon. We are crafting a digital experience worth waiting for.</p>

        <div class="countdown" id="countdown">
            <div class="countdown-item">
                <span class="countdown-value" id="days">00</span>
                <span class="countdown-label">Days</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-value" id="hours">00</span>
                <span class="countdown-label">Hrs</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-value" id="minutes">00</span>
                <span class="countdown-label">Min</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-value" id="seconds">00</span>
                <span class="countdown-label">Sec</span>
            </div>
        </div>
        
        <div class="signup-section">
            <div class="signup-container">
                <input 
                    type="email" 
                    id="emailInput" 
                    placeholder="Enter your email address"
                    autocomplete="email"
                    spellcheck="false"
                >
                <button id="submitBtn" onclick="handleSignup()">Notify Me</button>
            </div>
            <div class="message" id="message"></div>
        </div>
    </main>

    <div class="footer">
        <div class="footer-links">
            <a href="#" class="footer-link" aria-label="Twitter">𝕏</a>
            <a href="#" class="footer-link" aria-label="Instagram">IG</a>
            <a href="mailto:contactfdiw@gmail.com" class="footer-link" aria-label="Email">✉</a>
        </div>
        <div class="copyright">© 2026 FDIW — All Rights Reserved</div>
    </div>

    <script>
        // --- Countdown Logic ---
        // Set launch date to 14 days from now for demo purposes
        const launchDate = new Date();
        launchDate.setDate(launchDate.getDate() + 14); 

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // --- Signup Logic ---
        function handleSignup() {
            const emailInput = document.getElementById('emailInput');
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            const email = emailInput.value.trim();

            // Clear previous state
            messageDiv.className = 'message';
            messageDiv.textContent = '';

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (!email) {
                showMessage('Please enter your email', 'error');
                return;
            }

            if (!emailRegex.test(email)) {
                showMessage('Please enter a valid email address', 'error');
                return;
            }

            // Simulate API call with loading state
            submitBtn.classList.add('loading');
            
            setTimeout(() => {
                submitBtn.classList.remove('loading');
                showMessage('You are on the list! We will be in touch.', 'success');
                emailInput.value = '';
                console.log('Email signup:', email);
            }, 1500);
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type} visible`;
            
            // Clear error messages automatically, keep success messages longer
            if(type === 'error') {
                setTimeout(() => {
                    messageDiv.classList.remove('visible');
                }, 3000);
            }
        }

        // Allow Enter key to submit
        document.getElementById('emailInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                handleSignup();
            }
        });
    </script>
</body>
</html>
