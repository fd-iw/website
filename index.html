<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg: #0f172a;
            --card: #111827;
            --text: #e5e7eb;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }

        body {
            margin: 0;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: radial-gradient(circle at top, #1e293b, var(--bg));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            overflow: hidden;
        }

        .card {
            background: linear-gradient(180deg, #0b1220, var(--card));
            border-radius: 16px;
            padding: 40px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            text-align: center;
            animation: floatIn 1s ease forwards;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 2.2rem;
        }

        p {
            opacity: 0.85;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        button {
            background: var(--accent);
            color: #020617;
            border: none;
            padding: 14px 26px;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(56,189,248,0.4);
        }

        .message {
            margin-top: 25px;
            font-size: 1.1rem;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .message.show {
            opacity: 1;
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(56,189,248,0.25), transparent 70%);
            filter: blur(60px);
            top: -100px;
            right: -100px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="card">
        <h1>👋 Welcome</h1>
        <p>
            This is your custom welcome page.<br>
            Simple. Clean. Interactive.
        </p>

        <button id="welcomeBtn">Get Started</button>

        <div class="message" id="message">
            🚀 You are all gay
        </div>
    </div>

    <script>
        const btn = document.getElementById("welcomeBtn");
        const msg = document.getElementById("message");

        btn.addEventListener("click", () => {
            msg.classList.add("show");
            btn.textContent = "Enjoy!";
            btn.disabled = true;
            btn.style.opacity = "0.7";
            btn.style.cursor = "default";
        });
    </script>

</body>
</html>
